[versions]
aboutlib_version = "13.2.1"
leakcanary = "2.14"
moko = "0.26.4"
okhttp_version = "5.3.2"
shizuku_version = "13.1.5"
sqldelight = "2.3.2"
voyager = "1.1.0-beta03"
spotless = "8.8.0"
ktlint-core = "1.8.0"
firebase-bom = "34.15.0"
flexibleAdapter = "5.1.0"
markdown = "0.39.2"
junit = "6.1.3"
materialKolor = "5.0.0-alpha07"
# KMK --> Compose Multiplatform (desktop/iOS) - aligned with Kotlin 2.4.20
compose-multiplatform = "1.12.2"
# Material 3 for Compose Multiplatform is versioned separately. 1.11.0-alpha03 is the JetBrains
# build of androidx material3 1.5.0-alpha14, the version the androidx Compose BOM gives Android, so
# shared UI code sees the same Material 3 API on both targets (docs/kmp-desktop/PROGRESS.md, 4.0).
compose-multiplatform-material3 = "1.11.0-alpha03"
# material-icons-extended is frozen in Compose Multiplatform (last release 1.7.3).
compose-multiplatform-material-icons = "1.7.3"
# KMK <--
# KMK --> quickjs-kt (both artifacts below must stay on the same release)
quickjs-kt = "1.0.15"
# KMK <--
# KMK --> Ktor (HTTP of :source-js on iOS, Darwin engine; built with Kotlin 2.3.21 and coroutines 1.11.0)
ktor = "3.6.1"
# KMK <--

[libraries]
desugar = "com.android.tools:desugar_jdk_libs:2.1.5"
android-shortcut-gradle = "com.github.komikku-app:android-shortcut-gradle-plugin:0.2.0"

rxjava = "io.reactivex:rxjava:1.3.8"

okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp_version" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp_version" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp_version" }
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp_version" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp_version" }
# KMK --> tests only (desktop network smoke test)
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp_version" }
# KMK <--
okio = "com.squareup.okio:okio:3.17.0"

conscrypt-android = "org.conscrypt:conscrypt-android:2.5.3"

# KMK --> replaced by :core:quickjs (`app.cash.quickjs.QuickJs` on quickjs-kt, docs/kmp-desktop/PLAN.md I2b)
# quickjs-android = { group = "com.github.zhanghai.quickjs-java", name = "quickjs-android", version = "547f5b1597" }
# KMK <--
# KMK --> QuickJS binding (Android AAR; JVM natives for Windows x64, Linux x64/arm64, macOS x64/arm64) behind
# `app.cash.quickjs.QuickJs` in :core:quickjs and the JavaScript source host :source-js.
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs-kt" }
# JVM artifact (host natives) for Android host unit tests of modules using quickjs-kt: the Android AAR's
# native library cannot load on the build machine.
quickjs-kt-jvm = { module = "io.github.dokar3:quickjs-kt-jvm", version.ref = "quickjs-kt" }
# KMK <--
# KMK --> Multiplatform jsoup port (JVM + iOS) for the DOM bridge of :source-js (Mangayomi JavaScript sources).
ksoup = "com.fleeksoft.ksoup:ksoup:0.2.6"
# KMK <--
# KMK --> Ktor client on NSURLSession for `DarwinHostHttp` (:source-js iosMain); mock engine and CIO server for its tests.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
# KMK <--

jsoup = "org.jsoup:jsoup:1.23.2"

disklrucache = "com.jakewharton:disklrucache:2.0.2"
unifile = "com.github.komikku-app:UniFile:084a54140a"
libarchive = "me.zhanghai.android.libarchive:library:1.1.6"
# KMK --> desktop archive support in :core:archive (Android keeps libarchive): zip / cbz / epub
# incl. AES and ZipCrypto passwords (zip4j), RAR 4 (junrar), 7z (commons-compress + xz),
# tar / cpio / ar and compressed tarballs (commons-compress).
zip4j = "net.lingala.zip4j:zip4j:2.11.6"
junrar = "com.github.junrar:junrar:8.1.2"
commons-compress = "org.apache.commons:commons-compress:1.28.0"
xz = "org.tukaani:xz:1.12"
# KMK <--
# KMK --> desktop extension runtime (:desktop:extension-runtime): dex → JVM bytecode for extension APKs.
# Maintained dex2jar fork on Maven Central (Apache-2.0); brings dex-reader / dex-ir, asm-tree / asm-util /
# asm-commons 9.11.1 and `d2j-external` (its patched ASM core + AOSP dx/dex, all Apache-2.0 / BSD-3).
dex2jar-translator = "de.femtopedia.dex2jar:dex-translator:2.4.39"
# Tests only: X.509 certificates for APK signing fixtures.
bouncycastle-pkix = "org.bouncycastle:bcpkix-jdk18on:1.79"
# KMK <--

preferencektx = "androidx.preference:preference-ktx:1.2.1"

injekt = "com.github.mihonapp:injekt:91edab2317"

coil-bom = { module = "io.coil-kt.coil3:coil-bom", version = "3.5.0" }
coil-core = { module = "io.coil-kt.coil3:coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp" }

subsamplingscaleimageview = "com.github.tachiyomiorg:subsampling-scale-image-view:66e0db195d"
image-decoder = "com.github.tachiyomiorg:image-decoder:41c059e540"

natural-comparator = "com.github.gpanther:java-nat-sort:natural-comparator-1.1"

richeditor-compose = "com.mohamedrejeb.richeditor:richeditor-compose:1.0.0-rc13"

material = "com.google.android.material:material:1.14.0"
flexibleAdapter = { module = "eu.davidea:flexible-adapter", version.ref = "flexibleAdapter" }
photoview = "com.github.chrisbanes:PhotoView:2.3.0"
directionalviewpager = "com.github.tachiyomiorg:DirectionalViewPager:1.0.0"
compose-materialmotion = "io.github.fornewid:material-motion-compose-core:2.0.1"
compose-webview = "io.github.kevinnzou:compose-webview:0.33.6"
compose-grid = "io.woong.compose.grid:grid:1.2.2"
reorderable = { module = "sh.calvin.reorderable:reorderable", version = "3.1.0" }
palette-ktx = "androidx.palette:palette-ktx:1.0.0"
haze = "dev.chrisbanes.haze:haze:1.7.2"

swipe = "me.saket.swipe:swipe:1.3.0"

moko-core = { module = "dev.icerock.moko:resources", version.ref = "moko" }

timber = "com.jakewharton.timber:timber:5.0.1"
logcat = "com.squareup.logcat:logcat:0.4"

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

aboutLibraries-compose = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlib_version" }

shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku_version" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku_version" }

leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
leakcanary-plumber = { module = "com.squareup.leakcanary:plumber-android", version.ref = "leakcanary" }

sqldelight-androidx-driver = { module = "com.eygraber:sqldelight-androidx-driver", version = "0.0.17" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions-jvm", version.ref = "sqldelight" }
sqldelight-android-paging = { module = "app.cash.sqldelight:androidx-paging3-extensions", version.ref = "sqldelight" }
sqldelight-dialects-sql = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = "io.kotest:kotest-assertions-core:6.2.1"
mockk = "io.mockk:mockk:1.14.11"

voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screenmodel = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
voyager-tab-navigator = { module = "cafe.adriel.voyager:voyager-tab-navigator", version.ref = "voyager" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }

spotless-gradle = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }
ktlint-core = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint-core" }

markdown-core = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdown" }
markdown-coil = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "markdown" }

stringSimilarity = { module = "com.aallam.similarity:string-similarity-kotlin", version = "0.1.0" }

materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# KMK --> Compose Multiplatform libraries (desktop). KMP modules use these in `desktopMain` only; their
# `androidMain` keeps the androidx coordinates of the `compose` catalog under the Compose BOM ("BOM wins", PLAN.md D6).
compose-multiplatform-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform-material3" }
compose-multiplatform-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-multiplatform-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-multiplatform-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-multiplatform" }
compose-multiplatform-animation-graphics = { module = "org.jetbrains.compose.animation:animation-graphics", version.ref = "compose-multiplatform" }
compose-multiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-multiplatform-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
compose-multiplatform-ui-util = { module = "org.jetbrains.compose.ui:ui-util", version.ref = "compose-multiplatform" }
compose-multiplatform-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-multiplatform-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-multiplatform-material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-multiplatform-material-icons" }
# KMK <--

[plugins]
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
aboutLibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlib_version" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
moko = { id = "dev.icerock.mobile.multiplatform-resources", version.ref = "moko" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.8" }
# KMK --> Compose Multiplatform Gradle plugin (desktop packaging + multiplatform UI)
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
# KMK <--

[bundles]
okhttp = ["okhttp-core", "okhttp-logging", "okhttp-brotli", "okhttp-dnsoverhttps", "okhttp-zstd"]
# KMK --> replaced by :core:quickjs (I2b)
# js-engine = ["quickjs-android"]
# KMK <--
coil = ["coil-core", "coil-gif", "coil-compose", "coil-network-okhttp"]
shizuku = ["shizuku-api", "shizuku-provider"]
sqldelight = ["sqldelight-androidx-driver", "sqldelight-coroutines", "sqldelight-android-paging"]
voyager = ["voyager-navigator", "voyager-screenmodel", "voyager-tab-navigator", "voyager-transitions"]
test = ["junit-jupiter", "kotest-assertions", "mockk"]
markdown = ["markdown-core", "markdown-coil"]
# KMK -->
archive-desktop = ["zip4j", "junrar", "commons-compress", "xz"]
# Desktop counterpart of the androidx Compose libraries most UI modules use (foundation, material3, icons, animation, ui).
compose-multiplatform = ["compose-multiplatform-runtime", "compose-multiplatform-foundation", "compose-multiplatform-animation", "compose-multiplatform-animation-graphics", "compose-multiplatform-ui", "compose-multiplatform-ui-util", "compose-multiplatform-ui-tooling-preview", "compose-multiplatform-material3", "compose-multiplatform-material-icons"]
# KMK <--
