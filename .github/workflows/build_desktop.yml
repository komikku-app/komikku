name: Desktop builder
# KMK: builds the Compose Multiplatform desktop app (:desktopApp) installers on each OS with the app update check on
# (-Penable-updater), names them as the update check expects (Komikku-<version>-<os>-<arch>.<ext>) with SHA-256 sums,
# uploads them as workflow artifacts and, only when a maintainer asks for it, attaches them to a GitHub release
# (never published by this workflow, never touching other assets). Signing / notarization run only when their secrets
# are set. Never executed yet; see docs/kmp-desktop/BUILDING.md "Release pipeline" and "Signing".

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: >-
          Attach the installers to a GitHub release: none (workflow artifacts only), existing (upload to the existing
          release release_tag, draft or published; a published release only gets new files), draft (upload to the
          draft release release_tag; created as a draft for an existing tag when there is none)
        type: choice
        options:
          - none
          - existing
          - draft
        default: none
      release_tag:
        description: >-
          Release tag for existing / draft, v<versionName> (e.g. v1.14.1); the tag must point to the commit this run
          builds (run the workflow from the tag, or from a branch whose head is that commit)
        type: string
        default: ''
  push:
    tags:
      # desktop-v<versionName>: the release is v<versionName>; what is done with it comes from the repository variable
      # DESKTOP_RELEASE_MODE (none when unset, or existing / draft as above). With a release mode, desktop-v<x> and v<x>
      # must be on the same commit.
      - desktop-v*
    # KMK -->
    # Temporary, for the first CI builds of the desktop installers (macOS bring-up, docs/kmp-desktop/TESTING_MAC.md):
    # a dispatch-only workflow that is not on the default branch cannot be started, so a push to this branch that
    # changes this file or the marker file .github/desktop-build-trigger starts a run. Branch pushes never release
    # (`plan` forces mode none). Remove this trigger (and the marker file) when the port reaches master.
    branches:
      - claude/kmp-multiplatform-support
    paths:
      - '.github/workflows/build_desktop.yml'
      - '.github/desktop-build-trigger'
    # KMK <--

# No workflow-level concurrency group: a newer run of the same ref cancels an older run's packaging (job-level group
# per runner below), but never a run that has reached its release job, which has its own group per release tag
# without cancelling (an upload in progress always finishes). Trade-off: an older run whose packaging was cancelled
# ends cancelled, and two runs for the same tag upload one after the other (a run waiting for that group is replaced
# by a newer waiting one, as GitHub keeps one pending job per group).

permissions:
  contents: read

jobs:
  plan:
    name: Release plan
    runs-on: 'ubuntu-24.04'
    permissions:
      # Read the release tag (fetched below)
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Decide release mode and tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.release_mode }}
          INPUT_TAG: ${{ inputs.release_tag }}
          TAG_MODE: ${{ vars.DESKTOP_RELEASE_MODE }}
          REF_NAME: ${{ github.ref_name }}
          # KMK -->
          REF_TYPE: ${{ github.ref_type }}
          # KMK <--
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            mode=${INPUT_MODE:-none}
            tag=$INPUT_TAG
          # KMK -->
          elif [ "$REF_TYPE" != tag ]; then
            # A branch push (the temporary bring-up trigger): artifacts only, whatever DESKTOP_RELEASE_MODE says
            mode=none
            tag=
          # KMK <--
          else
            mode=${TAG_MODE:-none}
            tag="v${REF_NAME#desktop-v}"
          fi
          case "$mode" in
            none | existing | draft) ;;
            *) echo "::error::Unknown release mode '$mode' (none, existing, draft)"; exit 1 ;;
          esac
          if [ "$mode" != none ] && ! [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Release tag '$tag' is not v<x.y.z>"
            exit 1
          fi
          echo "Release mode: $mode${tag:+, tag $tag}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Only the commit itself (no history); the release tag is fetched explicitly by the next step
      - name: Clone repo
        if: steps.plan.outputs.mode != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The installers must be built from the commit the release tag points to: the version check in `package` alone
      # does not tie them to it (master keeps the released versionName until the next bump). For desktop-v<x> the
      # release is v<x>, so both tags must be on this run's commit.
      - name: Check the release tag's commit
        if: steps.plan.outputs.mode != 'none'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG does not exist (or could not be fetched); push it first"
            exit 1
          fi
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          run_commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          if [ "$tag_commit" != "$run_commit" ]; then
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "::error::Tag $RELEASE_TAG is on $tag_commit, this run builds $run_commit; run the workflow from the tag $RELEASE_TAG"
            else
              echo "::error::Tag $REF_NAME is on $run_commit but $RELEASE_TAG is on $tag_commit; put $REF_NAME on the commit of $RELEASE_TAG"
            fi
            exit 1
          fi
          echo "Tag $RELEASE_TAG is on this run's commit $run_commit"

  package:
    name: Package (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deb, Rpm, app image (packed as .tar.gz); x64
          - os: 'ubuntu-24.04'
            asset-os: linux
          # Msi, Exe (the Compose Gradle plugin downloads WiX); x64
          - os: 'windows-2022'
            asset-os: windows
          # Dmg; Apple silicon (arm64)
          - os: 'macos-15'
            asset-os: macos
          # Dmg; Intel (x64)
          - os: 'macos-15-intel'
            asset-os: macos
    runs-on: ${{ matrix.os }}
    # A newer run of the same ref cancels this runner's packaging (see the note at the top)
    concurrency:
      group: ${{ github.workflow }}-package-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      # Signing is on only when its secrets are there ('true' / 'false'; the values stay in the secrets)
      MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      MAC_NOTARIZATION: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID != '' && secrets.MACOS_NOTARIZATION_PASSWORD != '' && secrets.MACOS_NOTARIZATION_TEAM_ID != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    defaults:
      run:
        # `./gradlew` on Windows too (Git Bash)
        shell: bash

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a preview build (`-Pdesktop-preview`) compares release tags with the commit count,
          # which a shallow clone gets wrong (the Gradle build refuses a shallow clone for it)
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Before the long build: the version the assets are named with, the release tag it must match, the CPU
      # architecture (jpackage builds for the JDK it runs on, i.e. the runner's)
      - name: Version and architecture
        run: |
          set -euo pipefail
          output=$(./gradlew -q :desktopApp:printVersionName | tr -d '\r')
          marked=$(printf '%s\n' "$output" | grep '^desktopVersionName=' || true)
          if [ "$(printf '%s' "$marked" | grep -c '^')" -ne 1 ]; then
            echo "::error::printVersionName printed no single desktopVersionName=<version> line"
            printf '%s\n' "$output"
            exit 1
          fi
          version=${marked#desktopVersionName=}
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            # The packages would be built as the part before '-', the assets and the update check need the whole name
            echo "::error::versionName '$version' is not x.y.z; desktop releases do not support a suffix such as -rc1"
            exit 1
          fi
          if [ "$RELEASE_MODE" != none ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match this commit's version v$version"
            exit 1
          fi
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::No asset name for the runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          echo "Komikku $version, ${{ matrix.asset-os }}-$arch"
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          echo "DESKTOP_ARCH=$arch" >> "$GITHUB_ENV"

      # Unit + headless UI tests run on Linux only (as in the PR workflow's desktop job); they have not
      # been tried on Windows / macOS, which only package.
      - name: Test desktop app
        if: runner.os == 'Linux'
        run: ./gradlew :desktopApp:test --max-workers=2

      # KMK -->
      # JavaScript source host (:source-js) and the app.cash.quickjs.QuickJs engine (:core:quickjs); Linux only,
      # like the desktop tests.
      - name: Test JavaScript source host
        if: runner.os == 'Linux'
        run: ./gradlew :core:quickjs:desktopTest :source-js:desktopTest --max-workers=2
      # KMK <--

      # Signing hook (macOS): the Developer ID Application certificate into a temporary keychain that the Compose
      # plugin signs with (desktopApp/build.gradle.kts reads KOMIKKU_MAC_SIGNING_*)
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/komikku-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          certificate="$RUNNER_TEMP/komikku-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          echo "KOMIKKU_MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package desktop app
        env:
          # Empty unless this is a macOS runner with the signing / notarization secrets (then the Compose plugin signs)
          KOMIKKU_MAC_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          KOMIKKU_MAC_NOTARIZATION_APPLE_ID: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && env.MAC_NOTARIZATION == 'true' && secrets.MACOS_NOTARIZATION_APPLE_ID || '' }}
          KOMIKKU_MAC_NOTARIZATION_PASSWORD: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && env.MAC_NOTARIZATION == 'true' && secrets.MACOS_NOTARIZATION_PASSWORD || '' }}
          KOMIKKU_MAC_NOTARIZATION_TEAM_ID: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && env.MAC_NOTARIZATION == 'true' && secrets.MACOS_NOTARIZATION_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          # KMK -->
          # Linux: the app image directory for the .tar.gz is createDistributable's (no AppImage target, see
          # desktopApp/build.gradle.kts); the DEB / RPM tasks build it anyway, named here so it is always there
          tasks=(:desktopApp:packageDistributionForCurrentOS)
          if [ "$RUNNER_OS" = Linux ]; then tasks+=(:desktopApp:createDistributable); fi
          ./gradlew "${tasks[@]}" -Penable-updater
          # KMK <--
          if [ -n "$KOMIKKU_MAC_NOTARIZATION_APPLE_ID" ]; then
            # The Compose plugin's task submits the signed DMG with notarytool, waits for it and staples the ticket
            ./gradlew :desktopApp:notarizeDmg -Penable-updater
            for dmg in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
              xcrun stapler validate "$dmg"
            done
          fi

      # Signing hook (Windows): the Compose plugin has no Windows signing, so the installers are signed with signtool
      # (Windows SDK on the runner) from an exportable code-signing certificate (.pfx)
      - name: Sign Windows installers
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
          # signtool's /options must not be turned into paths by Git Bash
          MSYS_NO_PATHCONV: '1'
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/komikku-signing.pfx"
          printf '%s' "$WINDOWS_CERTIFICATE_PFX_BASE64" | base64 --decode > "$certificate"
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -n 1)
          for installer in desktopApp/build/compose/binaries/main/msi/*.msi desktopApp/build/compose/binaries/main/exe/*.exe; do
            "$signtool" sign /fd SHA256 /td SHA256 /tr "$TIMESTAMP_URL" \
              /f "$(cygpath -w "$certificate")" /p "$WINDOWS_CERTIFICATE_PASSWORD" "$(cygpath -w "$installer")"
            "$signtool" verify /pa "$(cygpath -w "$installer")"
          done
          rm -f "$certificate"

      - name: Collect release assets
        run: |
          .github/scripts/desktop_release_assets.sh desktopApp/build/compose/binaries/main \
            "$DESKTOP_VERSION" "${{ matrix.asset-os }}" "$DESKTOP_ARCH" release-assets

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.KOMIKKU_MAC_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$KOMIKKU_MAC_SIGNING_KEYCHAIN" || true

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-report-${{ matrix.asset-os }}-${{ runner.arch }}-${{ github.sha }}
          # KMK -->
          path: |
            desktopApp/build/reports/tests/test
            core/quickjs/build/reports/tests/desktopTest
            source-js/build/reports/tests/desktopTest
          # KMK <--

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-desktop-${{ matrix.asset-os }}-${{ runner.arch }}-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error

  release:
    name: Attach to release ${{ needs.plan.outputs.tag }}
    needs:
      - plan
      - package
    if: needs.plan.outputs.mode != 'none'
    runs-on: 'ubuntu-24.04'
    # One upload per release tag at a time, never cancelled by a newer run (see the note at the top)
    concurrency:
      group: ${{ github.workflow }}-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      # Upload release assets, create a draft release; nothing else
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Only the upload script, at this run's commit (the one the release tag points to, checked in `plan`)
      - name: Clone scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Komikku-desktop-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Check names and checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          for file in *; do
            case "$file" in
              "Komikku-$version-"*) ;;
              *) echo "::error::Unexpected file $file (not Komikku-$version-…)"; exit 1 ;;
            esac
          done
          for sums in *-SHA256SUMS.txt; do sha256sum -c "$sums"; done
          # One checksum file for the release: "<hash>  <name>" lines (as the asset script writes them), sorted by name
          cat -- *-SHA256SUMS.txt | tr -d '\r' | sed -E 's/^([0-9a-f]{64}) [ *]/\1  /' \
            | awk '{ print substr($0, 67) "\t" $0 }' | LC_ALL=C sort | cut -f 2- > "$RUNNER_TEMP/sums.txt"
          rm -f -- *-SHA256SUMS.txt
          mv "$RUNNER_TEMP/sums.txt" "Komikku-$version-desktop-SHA256SUMS.txt"
          sha256sum -c "Komikku-$version-desktop-SHA256SUMS.txt"
          ls -l

      # Never publishes and never edits a release: uploads files named Komikku-<version>-…, which no Android asset is
      # named like. A draft gets every file (same-named files replaced); a published release only gets the files it is
      # missing, and a file it already has must be identical (SHA-256) or nothing is uploaded. The merged checksum file
      # goes last, so a release that has it has every installer. Script: .github/scripts/desktop_release_upload.sh
      - name: Upload to the release
        run: .github/scripts/desktop_release_upload.sh release-assets
