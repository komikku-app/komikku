name: Desktop builder
# KMK: builds the Compose Multiplatform desktop app (:desktopApp) installers on each OS with the app update check on
# (-Penable-updater), names them as the update check expects (Komikku-<version>-<os>-<arch>.<ext>) with SHA-256 sums,
# uploads them as workflow artifacts and, only when a maintainer asks for it, attaches them to a GitHub release
# (never published by this workflow, never touching other assets). Signing / notarization run only when their secrets
# are set. Branch runs so far build only (release mode none; first green runs 45623103294 and 45625758564); the release
# jobs have not attached to a release yet. See docs/kmp-desktop/BUILDING.md "Release pipeline" and "Signing".
# KMK -->
# Two non-blocking jobs never hold up a release: the desktop tests on Windows (`windows-test`) and a smoke test of the
# installed app on Linux and Windows (`smoke`; how to read it: the comment above that job). Third-party extension code
# runs only in `extension-check`, which can reach no secret and gates nothing (ATLAS_INSTRUCTIONS.md ANSWER 010).
# KMK <--

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: >-
          Attach the installers to a GitHub release: none (workflow artifacts only), existing (upload to the existing
          release release_tag, draft or published; a published release only gets new files), draft (upload to the
          draft release release_tag; created as a draft for an existing tag when there is none)
        type: choice
        options:
          - none
          - existing
          - draft
        default: none
      release_tag:
        description: >-
          Release tag for existing / draft, v<versionName> (e.g. v1.14.1); the tag must point to the commit this run
          builds (run the workflow from the tag, or from a branch whose head is that commit)
        type: string
        default: ''
  push:
    tags:
      # desktop-v<versionName>: the release is v<versionName>; what is done with it comes from the repository variable
      # DESKTOP_RELEASE_MODE (none when unset, or existing / draft as above). With a release mode, desktop-v<x> and v<x>
      # must be on the same commit.
      - desktop-v*
    # KMK -->
    # Temporary, for the first CI builds of the desktop installers (macOS bring-up, docs/kmp-desktop/TESTING_MAC.md):
    # a dispatch-only workflow that is not on the default branch cannot be started, so a push to this branch that
    # changes the marker file .github/desktop-build-trigger starts a run (edits of this workflow do not: bump the marker
    # to test them). Branch pushes never release (`plan` forces mode none). Remove this trigger (and the marker file)
    # when the port reaches master.
    branches:
      - multiplatform
    paths:
      - '.github/desktop-build-trigger'
    # KMK <--
  # KMK -->
  # Weekly, for `extension-breadth` (and a full build with it, artifacts only). GitHub runs schedules only from the
  # default branch, so this starts once the workflow is there; until then the bring-up runs above carry that job.
  schedule:
    - cron: '17 3 * * 1'
  # Pull requests into this branch run only `pr-check` (ATLAS_INSTRUCTIONS.md ANSWER 009 point 3: the desktop job left
  # build_pull_request.yml, which is master's again); same path filter as that workflow
  pull_request:
    branches:
      - multiplatform
    paths:
      - '**'
      - '!**.md'
      - '!i18n-kmk/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n-kmk/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n-kmk/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n-kmk/src/commonMain/moko-resources/base/plurals.xml'
  # KMK <--

# No workflow-level concurrency group: a newer run of the same ref cancels an older run's packaging (job-level group
# per runner below), but never a run that has reached its release job, which has its own group per release tag
# without cancelling (an upload in progress always finishes). Trade-off: an older run whose packaging was cancelled
# ends cancelled, and two runs for the same tag upload one after the other (a run waiting for that group is replaced
# by a newer waiting one, as GitHub keeps one pending job per group).

permissions:
  contents: read

jobs:
  # KMK -->
  # Early warning on pull requests (moved from build_pull_request.yml): compiles and tests :desktopApp, which also
  # compiles the shared modules' desktop targets and the `app` files it borrows. `continue-on-error` keeps a desktop
  # failure from failing the PR check while the port is experimental (remove it once it is stable).
  pr-check:
    name: Desktop app (compile + tests)
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-24.04'
    continue-on-error: true
    concurrency:
      group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
          # Checks Adoptium's GPG signature when the JDK is downloaded (not when the runner's tool cache has it)
          verify-signature: true

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Compile desktop app
        run: ./gradlew :desktopApp:compileKotlin --max-workers=2

      - name: Run desktop tests
        id: desktop_tests
        run: ./gradlew :desktopApp:test --max-workers=2

      - name: Upload desktop test report
        if: failure() && steps.desktop_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-report-${{ github.sha }}
          path: desktopApp/build/reports/tests/test

      # JavaScript source host (:source-js, not a dependency of :desktopApp yet) and the app.cash.quickjs.QuickJs
      # engine (:core:quickjs, also run on the Android host by testReleaseUnitTest); runs even when the desktop
      # tests failed, under the same continue-on-error policy.
      - name: Run JavaScript source host tests
        id: source_js_tests
        if: ${{ !cancelled() }}
        run: ./gradlew :core:quickjs:desktopTest :source-js:desktopTest --max-workers=2

      - name: Upload JavaScript source host test report
        if: failure() && steps.source_js_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-js-test-report-${{ github.sha }}
          path: |
            core/quickjs/build/reports/tests/desktopTest
            source-js/build/reports/tests/desktopTest
  # KMK <--

  plan:
    name: Release plan
    # KMK -->
    # Nothing but `pr-check` on a pull request (this skips every job that needs `plan`)
    if: github.event_name != 'pull_request'
    # KMK <--
    runs-on: 'ubuntu-24.04'
    permissions:
      # Read the release tag (fetched below)
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Decide release mode and tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.release_mode }}
          INPUT_TAG: ${{ inputs.release_tag }}
          TAG_MODE: ${{ vars.DESKTOP_RELEASE_MODE }}
          REF_NAME: ${{ github.ref_name }}
          # KMK -->
          REF_TYPE: ${{ github.ref_type }}
          # KMK <--
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            mode=${INPUT_MODE:-none}
            tag=$INPUT_TAG
          # KMK -->
          elif [ "$REF_TYPE" != tag ]; then
            # A branch push (the temporary bring-up trigger): artifacts only, whatever DESKTOP_RELEASE_MODE says
            mode=none
            tag=
          # KMK <--
          else
            mode=${TAG_MODE:-none}
            tag="v${REF_NAME#desktop-v}"
          fi
          case "$mode" in
            none | existing | draft) ;;
            *) echo "::error::Unknown release mode '$mode' (none, existing, draft)"; exit 1 ;;
          esac
          if [ "$mode" != none ] && ! [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Release tag '$tag' is not v<x.y.z>"
            exit 1
          fi
          echo "Release mode: $mode${tag:+, tag $tag}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Only the commit itself (no history); the release tag is fetched explicitly by the next step
      - name: Clone repo
        if: steps.plan.outputs.mode != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The installers must be built from the commit the release tag points to: the version check in `package` alone
      # does not tie them to it (master keeps the released versionName until the next bump). For desktop-v<x> the
      # release is v<x>, so both tags must be on this run's commit.
      - name: Check the release tag's commit
        if: steps.plan.outputs.mode != 'none'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG does not exist (or could not be fetched); push it first"
            exit 1
          fi
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          run_commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          if [ "$tag_commit" != "$run_commit" ]; then
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "::error::Tag $RELEASE_TAG is on $tag_commit, this run builds $run_commit; run the workflow from the tag $RELEASE_TAG"
            else
              echo "::error::Tag $REF_NAME is on $run_commit but $RELEASE_TAG is on $tag_commit; put $REF_NAME on the commit of $RELEASE_TAG"
            fi
            exit 1
          fi
          echo "Tag $RELEASE_TAG is on this run's commit $run_commit"

  package:
    name: Package (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deb, Rpm, app image (packed as .tar.gz); x64
          - os: 'ubuntu-24.04'
            asset-os: linux
          # Msi, Exe (the Compose Gradle plugin downloads WiX); x64
          - os: 'windows-2022'
            asset-os: windows
          # Dmg; Apple silicon (arm64)
          - os: 'macos-15'
            asset-os: macos
          # Dmg; Intel (x64)
          - os: 'macos-15-intel'
            asset-os: macos
    runs-on: ${{ matrix.os }}
    # A newer run of the same ref cancels this runner's packaging (see the note at the top)
    concurrency:
      group: ${{ github.workflow }}-package-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      # Signing is on only when its secrets are there ('true' / 'false'; the values stay in the secrets)
      MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      MAC_NOTARIZATION: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID != '' && secrets.MACOS_NOTARIZATION_PASSWORD != '' && secrets.MACOS_NOTARIZATION_TEAM_ID != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    defaults:
      run:
        # `./gradlew` on Windows too (Git Bash)
        shell: bash

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a preview build (`-Pdesktop-preview`) compares release tags with the commit count,
          # which a shallow clone gets wrong (the Gradle build refuses a shallow clone for it)
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
          # Checks Adoptium's GPG signature when the JDK is downloaded (not when the runner's tool cache has it)
          verify-signature: true

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # WiX 3 for the .msi / .exe, pinned by version and SHA-256. The Compose plugin's own download (`downloadWix`, the
      # same URL) is not verified and is kept in the Gradle user home, which setup-gradle caches; with WIX_PATH set the
      # plugin uses this folder and creates no download task.
      - name: Download WiX (pinned)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip
          WIX_SHA256: 2c1888d5d1dba377fc7fa14444cf556963747ff9a0a289a3599cf09da03b9e2e
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wix311-binaries.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wix311'
          Invoke-WebRequest -Uri $env:WIX_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:WIX_SHA256) {
            Write-Output "::error::WiX download has SHA-256 $hash, expected $env:WIX_SHA256"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath $dir
          foreach ($tool in 'candle.exe', 'light.exe') {
            if (-not (Test-Path (Join-Path $dir $tool))) {
              Write-Output "::error::WiX archive has no $tool"
              exit 1
            }
          }
          "WIX_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Before the long build: the version the assets are named with, the release tag it must match, the CPU
      # architecture (jpackage builds for the JDK it runs on, i.e. the runner's)
      - name: Version and architecture
        run: |
          set -euo pipefail
          output=$(./gradlew -q :desktopApp:printVersionName | tr -d '\r')
          marked=$(printf '%s\n' "$output" | grep '^desktopVersionName=' || true)
          if [ "$(printf '%s' "$marked" | grep -c '^')" -ne 1 ]; then
            echo "::error::printVersionName printed no single desktopVersionName=<version> line"
            printf '%s\n' "$output"
            exit 1
          fi
          version=${marked#desktopVersionName=}
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            # The packages would be built as the part before '-', the assets and the update check need the whole name
            echo "::error::versionName '$version' is not x.y.z; desktop releases do not support a suffix such as -rc1"
            exit 1
          fi
          if [ "$RELEASE_MODE" != none ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match this commit's version v$version"
            exit 1
          fi
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::No asset name for the runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          echo "Komikku $version, ${{ matrix.asset-os }}-$arch"
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          echo "DESKTOP_ARCH=$arch" >> "$GITHUB_ENV"

      # Unit + headless UI tests run on Linux only here (as in the PR workflow's desktop job); Windows runs them in the
      # non-blocking `windows-test` job below, macOS only packages.
      - name: Test desktop app
        if: runner.os == 'Linux'
        run: ./gradlew :desktopApp:test --max-workers=2

      # KMK -->
      # JavaScript source host (:source-js) and the app.cash.quickjs.QuickJs engine (:core:quickjs); Linux only,
      # like the desktop tests.
      - name: Test JavaScript source host
        if: runner.os == 'Linux'
        run: ./gradlew :core:quickjs:desktopTest :source-js:desktopTest --max-workers=2
      # KMK <--

      # Signing hook (macOS): the Developer ID Application certificate into a temporary keychain that the Compose
      # plugin signs with (desktopApp/build.gradle.kts reads KOMIKKU_MAC_SIGNING_*)
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/komikku-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          certificate="$RUNNER_TEMP/komikku-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Only codesign may use the key (never -A, which lets every process use it): the one tool that signs with
          # it, called by the Compose plugin (MacSigner) and by jpackage (MacAppImageBuilder); `security` and
          # `openssl` only read the certificate, `xcrun notarytool` / `stapler` do not use it, and no .pkg is built
          # (`pkgbuild` / `productbuild`). Untested until the first signed build (BUILDING.md, "Signing").
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          echo "KOMIKKU_MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package desktop app
        env:
          # Empty unless this is a macOS runner with the signing / notarization secrets (then the Compose plugin signs)
          KOMIKKU_MAC_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          KOMIKKU_MAC_NOTARIZATION_APPLE_ID: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && env.MAC_NOTARIZATION == 'true' && secrets.MACOS_NOTARIZATION_APPLE_ID || '' }}
          KOMIKKU_MAC_NOTARIZATION_PASSWORD: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && env.MAC_NOTARIZATION == 'true' && secrets.MACOS_NOTARIZATION_PASSWORD || '' }}
          KOMIKKU_MAC_NOTARIZATION_TEAM_ID: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && env.MAC_NOTARIZATION == 'true' && secrets.MACOS_NOTARIZATION_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          # KMK -->
          # The app image directory (createDistributable): on Linux packed as the .tar.gz (no AppImage target, see
          # desktopApp/build.gradle.kts), on every OS started by the self-test below. The DMG / DEB / RPM tasks build it
          # anyway; the MSI / EXE tasks do not (M2: the first self-test run on Windows found no launcher)
          tasks=(:desktopApp:packageDistributionForCurrentOS :desktopApp:createDistributable)
          ./gradlew "${tasks[@]}" -Penable-updater
          # KMK <--
          if [ -n "$KOMIKKU_MAC_NOTARIZATION_APPLE_ID" ]; then
            # The Compose plugin's task submits the signed DMG with notarytool, waits for it and staples the ticket
            ./gradlew :desktopApp:notarizeDmg -Penable-updater
            for dmg in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
              xcrun stapler validate "$dmg"
            done
          fi

      # KMK -->
      # M2: the packaged app's self-test against its bundled runtime, not the build JDK (desktopApp/.../selftest/
      # DesktopSelfTest.kt): every module of desktopApp/runtime-modules.txt is in the runtime, a zip file system, dex2jar
      # on a fixture extension APK, EC crypto, charsets, locale data, the SQLite and QuickJS native libraries. The first
      # macOS test build lacked jdk.zipfs (no APK extension could be installed), which `run` and the tests could not
      # see. The report goes to a file as well, as the Windows launcher has no console.
      # M3: real extensions too, but never in this job (REVIEW_M3.md finding 1): it holds the signing identities on a
      # release run, so it runs only the app's own code and the bundled fixture APK. The real Keiyoushi extensions are
      # checked by the secret-free `extension-check` job below, on the installers this job uploads.
      - name: Self-test the packaged app
        timeout-minutes: 10
        run: |
          set -euo pipefail
          app=desktopApp/build/compose/binaries/main/app
          case "$RUNNER_OS" in
            macOS) launcher="$app/Komikku.app/Contents/MacOS/Komikku" ;;
            Windows) launcher="$app/Komikku/Komikku.exe" ;;
            *) launcher="$app/Komikku/bin/Komikku" ;;
          esac
          report=self-test-report.txt
          rm -f "$report"
          status=0
          "$launcher" "--self-test=$report" || status=$?
          if [ -f "$report" ]; then cat "$report"; else echo "::error::The self-test wrote no report"; fi
          if [ "$status" -ne 0 ] || [ "$(tail -n 1 "$report" 2>/dev/null | tr -d '\r')" != "SELF-TEST PASSED" ]; then
            echo "::error::The packaged app's self-test failed (exit code $status)"
            exit 1
          fi
      # KMK <--

      # Signing hook (Windows): the Compose plugin has no Windows signing, so the installers are signed with signtool
      # (Windows SDK on the runner) from an exportable code-signing certificate (.pfx)
      - name: Sign Windows installers
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
          # signtool's /options must not be turned into paths by Git Bash
          MSYS_NO_PATHCONV: '1'
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/komikku-signing.pfx"
          printf '%s' "$WINDOWS_CERTIFICATE_PFX_BASE64" | base64 --decode > "$certificate"
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -n 1)
          for installer in desktopApp/build/compose/binaries/main/msi/*.msi desktopApp/build/compose/binaries/main/exe/*.exe; do
            "$signtool" sign /fd SHA256 /td SHA256 /tr "$TIMESTAMP_URL" \
              /f "$(cygpath -w "$certificate")" /p "$WINDOWS_CERTIFICATE_PASSWORD" "$(cygpath -w "$installer")"
            "$signtool" verify /pa "$(cygpath -w "$installer")"
          done
          rm -f "$certificate"

      - name: Collect release assets
        run: |
          .github/scripts/desktop_release_assets.sh desktopApp/build/compose/binaries/main \
            "$DESKTOP_VERSION" "${{ matrix.asset-os }}" "$DESKTOP_ARCH" release-assets

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.KOMIKKU_MAC_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$KOMIKKU_MAC_SIGNING_KEYCHAIN" || true

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-report-${{ matrix.asset-os }}-${{ runner.arch }}-${{ github.sha }}
          # KMK -->
          path: |
            desktopApp/build/reports/tests/test
            core/quickjs/build/reports/tests/desktopTest
            source-js/build/reports/tests/desktopTest
          # KMK <--

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-desktop-${{ matrix.asset-os }}-${{ runner.arch }}-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error

  # KMK -->
  # M3: the packaged app's self-test with real extensions. The second macOS test build converted Keiyoushi's
  # extensions into classes the JVM's verifier rejects (no stack map frames, R8-inlined constructors) while the fixture
  # passed; this job converts the extensions pinned in .github/desktop-test-extensions.txt (Hiperdex, Kagane, MangaDex,
  # Weeb Central), verifies every class and fails on classes the host libraries lack.
  # Contained (REVIEW_M3.md finding 1, ATLAS_INSTRUCTIONS.md ANSWER 010): creating their sources runs third-party code,
  # so it never runs where a secret can be reached or an installer is made. This job references no secret, its token
  # is read-only, it does not check out the repository (no stored credentials, no post step), and no step runs after
  # the extension code (no later action whose runtime token, which can write caches and artifacts, could be read).
  # Each APK is fetched by the Keiyoushi commit the list pins and checked against its SHA-256 before it is loaded.
  # It unpacks the installers `package` uploaded (Linux .tar.gz, macOS .dmg, Windows .msi as an administrative image)
  # instead of building again. It never gates `release` (ANSWER 010).
  extension-check:
    name: Self-test with real extensions (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-24.04'
            asset-os: linux
          - os: 'windows-2022'
            asset-os: windows
          - os: 'macos-15'
            asset-os: macos
          - os: 'macos-15-intel'
            asset-os: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-extension-check-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Komikku-desktop-${{ matrix.asset-os }}-${{ runner.arch }}-${{ github.sha }}
          path: packages

      - name: Unpack the app (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tarballs=(packages/*.tar.gz)
          app="$RUNNER_TEMP/komikku-app"
          mkdir -p "$app"
          tar -xzf "${tarballs[0]}" -C "$app"
          echo "KOMIKKU_LAUNCHER=$app/Komikku/bin/Komikku" >> "$GITHUB_ENV"

      - name: Unpack the app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmgs=(packages/*.dmg)
          mount="$RUNNER_TEMP/komikku-dmg"
          app="$RUNNER_TEMP/komikku-app"
          mkdir -p "$mount" "$app"
          # `yes` accepts a licence agreement, should the image carry one
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "${dmgs[0]}" < <(yes)
          ditto "$mount/Komikku.app" "$app/Komikku.app"
          hdiutil detach "$mount"
          echo "KOMIKKU_LAUNCHER=$app/Komikku.app/Contents/MacOS/Komikku" >> "$GITHUB_ENV"

      # An administrative installation only unpacks the MSI's files into a folder (nothing is registered)
      - name: Unpack the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -LiteralPath packages -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { throw "expected one .msi, found $($msi.Count)" }
          $app = Join-Path $env:RUNNER_TEMP 'komikku-app'
          $log = Join-Path $env:RUNNER_TEMP 'msi-extract.log'
          $process = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList @('/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$app`"", '/l*v', "`"$log`"")
          if ($process.ExitCode -ne 0) {
            Get-Content -LiteralPath $log -Tail 60 -ErrorAction SilentlyContinue
            throw "msiexec /a exited with $($process.ExitCode)"
          }
          $launcher = Get-ChildItem -LiteralPath $app -Filter 'Komikku.exe' -File -Recurse | Select-Object -First 1
          if (-not $launcher) {
            Get-ChildItem -LiteralPath $app -Recurse -Name | Select-Object -First 60
            throw 'no Komikku.exe in the administrative image'
          }
          "KOMIKKU_LAUNCHER=$($launcher.FullName)" >> $env:GITHUB_ENV

      # This run's pinned list and its script through the API, not a checkout (see the note above the job)
      - name: Get the pinned extension list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in .github/desktop-test-extensions.txt .github/scripts/desktop_test_extensions.sh; do
            mkdir -p "$(dirname "$file")"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_SHA" > "$file"
          done

      # The last step of this job (see the note above the job)
      - name: Self-test with real extensions
        timeout-minutes: 10
        run: |
          set -euo pipefail
          launcher=$KOMIKKU_LAUNCHER
          if [ "$RUNNER_OS" = Windows ]; then launcher=$(cygpath -u "$launcher"); fi
          if [ ! -x "$launcher" ]; then
            echo "::error::No launcher at $launcher"
            exit 1
          fi
          extensions=self-test-extensions
          rm -rf "$extensions"
          bash .github/scripts/desktop_test_extensions.sh fetch .github/desktop-test-extensions.txt "$extensions"
          # Relative paths: Git Bash would not turn --self-test=/d/... into a Windows path for the launcher
          report=self-test-report.txt
          rm -f "$report"
          status=0
          "$launcher" "--self-test=$report" "--self-test-extensions=$extensions" || status=$?
          if [ -f "$report" ]; then cat "$report"; else echo "::error::The self-test wrote no report"; fi
          if [ "$status" -ne 0 ] || [ "$(tail -n 1 "$report" 2>/dev/null | tr -d '\r')" != "SELF-TEST PASSED" ]; then
            echo "::error::The packaged app's self-test with real extensions failed (exit code $status)"
            exit 1
          fi

  # ANSWER 010: the breadth check. The link checker inside the packaged Linux app (its jars as the host class path, the
  # runner's JDK 21; the app's runtime has no `java` command) over every APK in Keiyoushi's live index: which android.*
  # classes the catalogue references and how many extensions each blocks, host library gaps, conversion failures, as
  # a job summary and the artifact desktop-extension-breadth-<sha>. Static (no extension code runs), no secrets, never
  # gates anything. On the schedule (once this workflow is on the default branch) and on this branch's bring-up runs,
  # never on a tag or a dispatched run.
  extension-breadth:
    name: Link check of the Keiyoushi catalogue (non-blocking)
    needs: package
    if: >-
      ${{ !cancelled() && needs.package.result != 'skipped'
      && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'branch')) }}
    runs-on: 'ubuntu-24.04'
    continue-on-error: true
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-extension-breadth-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Clone scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Komikku-desktop-linux-X64-${{ github.sha }}
          path: packages

      - name: Link check
        run: |
          set -euo pipefail
          commit=$(git ls-remote https://github.com/keiyoushi/extensions.git refs/heads/repo | cut -f 1)
          if ! [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No head commit of keiyoushi/extensions' repo branch"
            exit 1
          fi
          echo "INDEX_COMMIT=$commit" >> "$GITHUB_ENV"
          tarballs=(packages/*.tar.gz)
          mkdir -p app breadth
          tar -xzf "${tarballs[0]}" -C app
          # The checker reads every APK URL of the index itself (a grep missed names with capitals), downloads each into
          # its temporary work folder, checks it and deletes it; a download that fails is a "failed:" block of the report
          "$JAVA_HOME_21_X64/bin/java" -cp 'app/Komikku/lib/app/*' app.komikku.desktop.extension.linkcheck.LinkCheckMainKt \
            "--index=https://raw.githubusercontent.com/keiyoushi/extensions/$commit/index.pb" \
            --output=breadth/linkcheck.txt > /dev/null 2> breadth/progress.log
          echo "$(grep -c '^== ' breadth/linkcheck.txt) APKs in the index at $commit checked," \
            "$(grep -c '^== .*: failed: ' breadth/linkcheck.txt || true) failed (download or conversion)"
          python3 .github/scripts/desktop_extension_breadth.py breadth/linkcheck.txt "$INDEX_COMMIT" > breadth/summary.md
          cat breadth/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-extension-breadth-${{ github.sha }}
          path: breadth/
          if-no-files-found: warn
          retention-days: 30

  # Track D, step 1 (docs/kmp-desktop/WINDOWS_LINUX_TEST_PLAN.md): the desktop unit + headless UI tests and the
  # Android compat layer's tests (:desktop:android-compat) on Windows, where they had never run. Non-blocking (`continue-on-error`): a failure marks this job red but neither fails the
  # run nor holds up `release`, which depends only on `package`. The HTML report and the JUnit XML are uploaded when the
  # tests fail.
  windows-test:
    name: Desktop tests (windows-2022, non-blocking)
    if: github.event_name != 'pull_request'
    runs-on: 'windows-2022'
    continue-on-error: true
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-windows-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
          # Checks Adoptium's GPG signature when the JDK is downloaded (not when the runner's tool cache has it)
          verify-signature: true

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # The Android compat layer's tests too (its file URIs and paths are platform-specific); --continue runs both
      # modules' tests when one fails
      - name: Test desktop app
        id: desktop_tests
        run: ./gradlew :desktopApp:test :desktop:android-compat:test --continue --max-workers=2

      - name: Upload test report
        if: failure() && steps.desktop_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-report-windows-2022-${{ github.sha }}
          path: |
            desktopApp/build/reports/tests/test
            desktopApp/build/test-results/test
            desktop/android-compat/build/reports/tests/test
            desktop/android-compat/build/test-results/test
          retention-days: 14

  # Track D, step 2 (WINDOWS_LINUX_TEST_PLAN.md, section 4): installs what `package` built on a fresh runner, starts the
  # installed app on a fresh data folder (-Dkomikku.dataDir, never the default one), waits for its window, takes
  # screenshots, switches the top-level tabs with Ctrl+2…5 and Ctrl+1, minimizes the window and starts the launcher
  # again on the same data folder (the single-instance lock must restore the window and end that start with exit code
  # 0), closes the window and checks a clean exit and a log without errors (apart from an allow-list in the scripts,
  # each entry with its reason), then uninstalls. Driven only from outside (window system, keyboard shortcuts); Linux on Xvfb
  # with openbox. On Linux also the installed launcher's `--self-test-notify` (WINDOWS_LINUX_TEST_PLAN.md, section 5),
  # each run on a session bus of its own with dbus-monitor: without a notification service (must fail), then with dunst
  # the plain self-test (no notification), notify-send and gdbus; on Windows the same self-test through the temporary
  # tray icon. On Linux also the .rpm in a Fedora container: installed without menu folders, upgraded twice and erased,
  # with the menu entry checked after each step (nothing graphical). Scripts: .github/scripts/desktop_smoke_linux.sh,
  # desktop_smoke_rpm.sh and desktop_smoke_windows.ps1.
  # Non-blocking (`continue-on-error`), and `release` must keep depending only on `package` until this job has been
  # green on ten consecutive runs (ATLAS_INSTRUCTIONS.md, ANSWER 005).
  #
  # Reading a run: the job summary has one table per OS (PASS / FAIL / INFO per check); the artifact
  # desktop-smoke-<os>-X64-<sha> (always uploaded, 14 days) holds
  #   summary.md                 the same table
  #   screenshots/01-start.png   the window's content after start, then 02-ctrl2-updates … 06-ctrl1-library.png after
  #                              each shortcut (each one taken once the screen stopped changing); 01-start-screen.png is
  #                              the whole screen; 07-second-start-screen.png the whole screen after the second start;
  #                              no-window-<n>.png / close-timeout.png / second-start-timeout.png only when that went
  #                              wrong
  #   logs/data-<n>/komikku.log  the app's own log of attempt n (debug level), with the data folder's file list
  #   logs/app-std*-<n>.log      the launcher's stdout / stderr (empty on Windows if the GUI launcher drops them);
  #                              logs/second-start-std*.log the same for the second start
  #   log-problems.txt           every error-level and stack-trace line of the app log that is not allow-listed
  #   logs/notify-<run>.*        Linux, runs c / silent / a / b: the self-test report (.txt), its exit code (.exit),
  #                              the Notify calls dbus-monitor saw (.monitor.log); screenshots/notify-<run>.png the
  #                              screen while that run's bus was up (dunst's popup for a and b)
  #   logs/notify.txt, notify-std*.log, screenshots/notify-<n>.png  Windows: the self-test report and the screen
  #                              every 3 s while it ran (the balloon of the temporary tray icon)
  #   rpm/summary.md, rpm/logs/  Linux: the RPM test's table and its rpm / dnf / rpmrebuild output
  #   logs/install.log, apt-*.log, menu-folders.log, uninstall.log, xvfb.log, openbox.log, windows-<n>.txt, jstack.txt
  #                              as they apply
  # Attempt 2 exists only when no window appeared with Skiko's default renderer and the app was started again with
  # SKIKO_RENDER_API=SOFTWARE; that is a finding even when attempt 2 passes.
  smoke:
    name: Smoke test (${{ matrix.os }}, non-blocking)
    needs: package
    # Also when another OS's packaging failed; a missing artifact for this OS then fails the download step
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-24.04'
            asset-os: linux
          - os: 'windows-2022'
            asset-os: windows
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-smoke-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      # Only the scripts, at this run's commit
      - name: Clone scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Komikku-desktop-${{ matrix.asset-os }}-${{ runner.arch }}-${{ github.sha }}
          path: packages

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: .github/scripts/desktop_smoke_linux.sh packages smoke-output

      # Also when the .deb smoke test failed: it does not depend on it
      - name: RPM install, upgrade and erase (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 20
        run: .github/scripts/desktop_smoke_rpm.sh packages smoke-output/rpm

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/desktop_smoke_windows.ps1 -Packages packages -Output smoke-output

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ matrix.asset-os }}-${{ runner.arch }}-${{ github.sha }}
          path: smoke-output/
          if-no-files-found: warn
          retention-days: 14
  # KMK <--

  release:
    name: Attach to release ${{ needs.plan.outputs.tag }}
    # KMK -->
    # Never on `windows-test` or `smoke` while they are non-blocking (ATLAS_INSTRUCTIONS.md, ANSWER 005), never on
    # `extension-check` (ANSWER 010: third-party code never gates a release)
    # KMK <--
    needs:
      - plan
      - package
    if: needs.plan.outputs.mode != 'none'
    runs-on: 'ubuntu-24.04'
    # One upload per release tag at a time, never cancelled by a newer run (see the note at the top)
    concurrency:
      group: ${{ github.workflow }}-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      # Upload release assets, create a draft release; nothing else
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Only the upload script, at this run's commit (the one the release tag points to, checked in `plan`)
      - name: Clone scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      # KMK -->
      # Each artifact into its own folder, not merged: only the artifacts the `package` matrix uploads are taken, so an
      # artifact another job of this run uploaded under a similar name can never replace an installer. A new `package`
      # runner must be added to `expected` below.
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Komikku-desktop-*-${{ github.sha }}
          path: downloaded-packages

      - name: Take the package artifacts
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected=(linux-X64 windows-X64 macos-ARM64 macos-X64)
          for dir in downloaded-packages/*/; do
            name=$(basename "$dir")
            known=false
            for entry in "${expected[@]}"; do
              if [ "$name" = "Komikku-desktop-$entry-$SHA" ]; then known=true; fi
            done
            if [ "$known" != true ]; then
              echo "::error::Unexpected artifact $name (not uploaded by the package matrix)"
              exit 1
            fi
          done
          mkdir -p release-assets
          for entry in "${expected[@]}"; do
            dir="downloaded-packages/Komikku-desktop-$entry-$SHA"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing artifact Komikku-desktop-$entry-$SHA"
              exit 1
            fi
            for file in "$dir"/*; do
              if [ -e "release-assets/$(basename "$file")" ]; then
                echo "::error::$(basename "$file") is in two artifacts"
                exit 1
              fi
              mv "$file" release-assets/
            done
          done
      # KMK <--

      - name: Check names and checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          for file in *; do
            case "$file" in
              "Komikku-$version-"*) ;;
              *) echo "::error::Unexpected file $file (not Komikku-$version-…)"; exit 1 ;;
            esac
          done
          for sums in *-SHA256SUMS.txt; do sha256sum -c "$sums"; done
          # One checksum file for the release: "<hash>  <name>" lines (as the asset script writes them), sorted by name
          cat -- *-SHA256SUMS.txt | tr -d '\r' | sed -E 's/^([0-9a-f]{64}) [ *]/\1  /' \
            | awk '{ print substr($0, 67) "\t" $0 }' | LC_ALL=C sort | cut -f 2- > "$RUNNER_TEMP/sums.txt"
          rm -f -- *-SHA256SUMS.txt
          mv "$RUNNER_TEMP/sums.txt" "Komikku-$version-desktop-SHA256SUMS.txt"
          sha256sum -c "Komikku-$version-desktop-SHA256SUMS.txt"
          ls -l

      # Never publishes and never edits a release: uploads files named Komikku-<version>-…, which no Android asset is
      # named like. A draft gets every file (same-named files replaced); a published release only gets the files it is
      # missing, and a file it already has must be identical (SHA-256) or nothing is uploaded. The merged checksum file
      # goes last, so a release that has it has every installer. Script: .github/scripts/desktop_release_upload.sh
      - name: Upload to the release
        run: .github/scripts/desktop_release_upload.sh release-assets
