name: Desktop builder
# KMK: builds the Compose Multiplatform desktop app (:desktopApp) installers on each OS and uploads
# them as workflow artifacts. Manual, or on a `desktop-v*` tag. Unsigned: no secrets are needed.
# See docs/kmp-desktop/BUILDING.md.

on:
  workflow_dispatch:
    # TODO(signing): add inputs / secrets once certificates exist, e.g. a `sign` boolean plus
    #  MACOS_SIGNING_IDENTITY / MACOS_NOTARIZATION_{APPLE_ID,PASSWORD,TEAM_ID} for
    #  `compose.desktop.application.nativeDistributions.macOS { signing {}; notarization {} }` and a
    #  Windows code-signing certificate for signtool. Not configured on purpose.
  push:
    tags:
      - desktop-v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deb, Rpm, AppImage (app-image directory)
          - os: 'ubuntu-24.04'
          # Msi, Exe (the Compose Gradle plugin downloads WiX)
          - os: 'windows-2022'
          # Dmg (unsigned, not notarized)
          - os: 'macos-15'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # `./gradlew` on Windows too (Git Bash)
        shell: bash

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Unit + headless UI tests run on Linux only (as in the PR workflow's desktop job); they have not
      # been tried on Windows / macOS, which only package.
      - name: Test desktop app
        if: runner.os == 'Linux'
        run: ./gradlew :desktopApp:test --max-workers=2

      # KMK -->
      # JavaScript source host (:source-js); Linux only, like the desktop tests.
      - name: Test JavaScript source host
        if: runner.os == 'Linux'
        run: ./gradlew :source-js:desktopTest --max-workers=2
      # KMK <--

      - name: Package desktop app
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-report-${{ runner.os }}-${{ github.sha }}
          # KMK -->
          path: |
            desktopApp/build/reports/tests/test
            source-js/build/reports/tests/desktopTest
          # KMK <--

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-desktop-${{ runner.os }}-${{ github.sha }}
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
            desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error
