name: iOS check
# KMK: compiles the JavaScript source host (:source-js) for iOS (device + simulator) and runs its common tests on an
# iOS simulator: the first check of the iOS code (docs/kmp-desktop/PLAN.md section 8, I5). No app, no signing, no
# secrets. See docs/kmp-desktop/IOS_CI.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source-js/**'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/.java-version'
      - '.github/workflows/build_ios_check.yml'
  # Branch pushes only (a branch filter alone means tags never trigger it); other branches are covered by their PR
  push:
    branches:
      - master
      - claude/kmp-multiplatform-support
    paths:
      - 'source-js/**'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/.java-version'
      - '.github/workflows/build_ios_check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-js:
    name: JavaScript source host (iOS compile + simulator tests)
    # Apple silicon: the iOS targets are only declared on a macOS host (source-js/build.gradle.kts), and the
    # iosSimulatorArm64 tests need an arm64 Mac
    # KMK: runs on the maintainer's own Mac (self-hosted runner, label `self-hosted`; see
    # docs/kmp-desktop/BUILDING.md "Self-hosted Mac runner"), except for pull requests from forks: their code must
    # never run on that machine, so they stay on the GitHub-hosted runner
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'macos-15' || 'self-hosted' }}
    timeout-minutes: 60

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # For reading a failure: the Xcode the Kotlin/Native toolchain links against, and the simulators the test task
      # can pick its default device from
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # Main and test klibs for both iOS targets, then the test binary linked and run on an iOS simulator (commonTest
      # and iosTest)
      - name: Compile and test for iOS
        run: >-
          ./gradlew
          :source-js:compileKotlinIosArm64
          :source-js:compileKotlinIosSimulatorArm64
          :source-js:compileTestKotlinIosArm64
          :source-js:iosSimulatorArm64Test
          --max-workers=2

      # The WebKit tests again, inside an app bundle: the test task spawns the bare test executable, where WebKit
      # cannot start its web content and networking processes, so those tests return early there
      # (source-js/src/iosTest/.../WebKitTest.kt). Installed and launched as an app on a booted simulator, with
      # KMK_WEBKIT_REQUIRED=1 so that a web view that does not work fails them (docs/kmp-desktop/IOS_CI.md, I5c)
      - name: WebKit tests in a simulator app
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SourceJsTests.app"
          BUNDLE_ID=app.komikku.sourcejs.tests
          rm -rf "$APP" && mkdir -p "$APP"
          cp source-js/build/bin/iosSimulatorArm64/debugTest/test.kexe "$APP/SourceJsTests"
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>app.komikku.sourcejs.tests</string>
            <key>CFBundleExecutable</key><string>SourceJsTests</string>
            <key>CFBundleName</key><string>SourceJsTests</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneSimulator</string></array>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>14.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - "$APP"
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              # com.apple.CoreSimulator.SimRuntime.iOS-18-2 -> (18, 2): numeric, so iOS-18-10 sorts after iOS-18-2
              return tuple(int(part) for part in runtime.rsplit(".", 1)[-1].split("-")[1:] if part.isdigit())
          ios = sorted((version(runtime), d["name"], d["udid"]) for runtime, ds in devices.items() if ".iOS-" in runtime for d in ds if d["name"].startswith("iPhone"))
          print(ios[-1][2])
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_KMK_WEBKIT_REQUIRED=1 xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BUNDLE_ID" \
            '--ktest_filter=*WKWebViewHostWebViewTest.*:*WebViewBridgeTest.*:*IosJsSourceRuntimeWebViewTest.*' \
            2>&1 | tee "$RUNNER_TEMP/webkit-tests.log" || true
          xcrun simctl shutdown "$UDID" || true
          # The runner's own summary: at least the expected number of tests passed (WKWebViewHostWebViewTest 17,
          # WebViewBridgeTest 6, IosJsSourceRuntimeWebViewTest 2; raise it with new tests), none failed, none skipped
          # by WebKitTest
          MIN_TESTS=25
          PASSED=$(sed -nE 's/^\[ +PASSED +\] ([0-9]+) tests.*/\1/p' "$RUNNER_TEMP/webkit-tests.log" | tail -n 1)
          echo "Passed: ${PASSED:-none} (expected at least $MIN_TESTS)"
          if [ -z "$PASSED" ] || [ "$PASSED" -lt "$MIN_TESTS" ]; then exit 1; fi
          if grep -E '^\[ +FAILED +\]|SKIPPED: ' "$RUNNER_TEMP/webkit-tests.log"; then exit 1; fi

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-report-${{ github.sha }}
          path: |
            source-js/build/reports/tests/iosSimulatorArm64Test
            source-js/build/test-results/iosSimulatorArm64Test
          if-no-files-found: ignore
