name: iOS check
# KMK: compiles the JavaScript source host (:source-js) for iOS (device + simulator) and runs its common tests on an
# iOS simulator: the first check of the iOS code (docs/kmp-desktop/PLAN.md section 8, I5). No app, no signing, no
# secrets. See docs/kmp-desktop/IOS_CI.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source-js/**'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/.java-version'
      - '.github/workflows/build_ios_check.yml'
  # Branch pushes only (a branch filter alone means tags never trigger it); other branches are covered by their PR
  push:
    branches:
      - master
      - multiplatform
    paths:
      - 'source-js/**'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/.java-version'
      - '.github/workflows/build_ios_check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-js:
    name: JavaScript source host (iOS compile + simulator tests)
    # Apple silicon: the iOS targets are only declared on a macOS host (source-js/build.gradle.kts), and the
    # iosSimulatorArm64 tests need an arm64 Mac
    runs-on: 'macos-15'
    timeout-minutes: 60

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # For reading a failure: the Xcode the Kotlin/Native toolchain links against, and the simulators the test task
      # can pick its default device from
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # Main and test klibs for both iOS targets, then the test binary linked and run on an iOS simulator (commonTest
      # and iosTest)
      - name: Compile and test for iOS
        run: >-
          ./gradlew
          :source-js:compileKotlinIosArm64
          :source-js:compileKotlinIosSimulatorArm64
          :source-js:compileTestKotlinIosArm64
          :source-js:iosSimulatorArm64Test
          --max-workers=2

      # The WebKit tests again, inside an app bundle: the test task spawns the bare test executable, where WebKit
      # cannot start its web content and networking processes, so those tests return early there
      # (source-js/src/iosTest/.../WebKitTest.kt). Installed and launched as an app on a booted simulator, with
      # KMK_WEBKIT_REQUIRED=1 so that a web view that does not work fails them (docs/kmp-desktop/IOS_CI.md, I5c).
      # `simctl launch` does not return the app's exit status (`--console-pty` returns 0 even after a failure or a
      # crash) and `simctl spawn`, which does, gets no WebKit on this runner: the status is read from the simulator's log
      - name: WebKit tests in a simulator app
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The test classes that use WebKit; the number of tests each must pass is read from its source
          CLASSES="WKWebViewHostWebViewTest WebViewBridgeTest IosJsSourceRuntimeWebViewTest WKWebViewRetentionProbeTest"
          APP="$RUNNER_TEMP/SourceJsTests.app"
          LOG="$RUNNER_TEMP/webkit-tests.log"
          ERRORS="$RUNNER_TEMP/webkit-tests.stderr"
          BUNDLE_ID=app.komikku.sourcejs.tests
          rm -rf "$APP" && mkdir -p "$APP"
          cp source-js/build/bin/iosSimulatorArm64/debugTest/test.kexe "$APP/SourceJsTests"
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>app.komikku.sourcejs.tests</string>
            <key>CFBundleExecutable</key><string>SourceJsTests</string>
            <key>CFBundleName</key><string>SourceJsTests</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneSimulator</string></array>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>14.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - "$APP"
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              # com.apple.CoreSimulator.SimRuntime.iOS-18-2 -> (18, 2): numeric, so iOS-18-10 sorts after iOS-18-2
              return tuple(int(part) for part in runtime.rsplit(".", 1)[-1].split("-")[1:] if part.isdigit())
          ios = sorted((version(runtime), d["name"], d["udid"]) for runtime, ds in devices.items() if ".iOS-" in runtime for d in ds if d["name"].startswith("iPhone"))
          print(ios[-1][2])
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          FILTER=$(for class in $CLASSES; do printf '*.%s.*:' "$class"; done)
          START=$(date -v-1M '+%Y-%m-%d %H:%M:%S')
          rm -f "$LOG" "$ERRORS"
          LAUNCHED=$(SIMCTL_CHILD_KMK_WEBKIT_REQUIRED=1 xcrun simctl launch --terminate-running-process \
            --stdout="$LOG" --stderr="$ERRORS" "$UDID" "$BUNDLE_ID" "--ktest_filter=${FILTER%:}")
          PID=$(printf '%s\n' "$LAUNCHED" | sed -nE "s/^$BUNDLE_ID: ([0-9]+)$/\1/p")
          echo "Test app: pid ${PID:-none}"
          if [ -z "$PID" ]; then exit 1; fi
          # A simulator app is a process of this Mac
          while kill -0 "$PID" 2>/dev/null; do sleep 1; done
          touch "$LOG" "$ERRORS"
          cat "$LOG"
          cat "$ERRORS" >&2
          # Its wait status, as launchd reported it to RunningBoard: "termination reported by launchd (0, 0, 768)" is
          # exit(3), "(2, 6, 6)" SIGABRT; anything but 0, or no report, fails the step
          sleep 2
          TERMINATION=$(xcrun simctl spawn "$UDID" log show --start "$START" --style compact \
            --predicate "process == \"runningboardd\" AND eventMessage CONTAINS \":$PID] termination reported by launchd\"" \
            | sed -nE 's/.*termination reported by launchd \(([0-9]+, [0-9]+, [0-9]+)\).*/\1/p' | tail -n 1 || true)
          xcrun simctl shutdown "$UDID" || true
          FAILED=0
          echo "Test app termination: (${TERMINATION:-not reported}), wait status ${TERMINATION##*, }"
          if [ "${TERMINATION##*, }" != "0" ]; then FAILED=1; fi
          # Every test of each class passed: as many `[ OK ]` lines as the class has @Test functions
          EXPECTED_TOTAL=0
          for class in $CLASSES; do
            SOURCES=$(find source-js/src -name "$class.kt")
            if [ "$(printf '%s\n' "$SOURCES" | grep -c .)" -ne 1 ]; then
              echo "::error::$class: expected one source file, found: ${SOURCES:-none}"
              FAILED=1
              continue
            fi
            EXPECTED=$(grep -cE '^[[:space:]]*@Test([[:space:](]|$)' "$SOURCES" || true)
            PASSED=$(grep -cE "^\[ +OK +\] [A-Za-z0-9_.]*\.$class\.[A-Za-z0-9_]+ " "$LOG" || true)
            echo "$class: $PASSED of $EXPECTED tests passed"
            if [ "$EXPECTED" -eq 0 ] || [ "$PASSED" -ne "$EXPECTED" ]; then FAILED=1; fi
            EXPECTED_TOTAL=$((EXPECTED_TOTAL + EXPECTED))
          done
          # The runner's own summary agrees, nothing failed, and no test returned early because WebKit did not run
          SUMMARY=$(sed -nE 's/^\[ +PASSED +\] ([0-9]+) tests.*/\1/p' "$LOG" | tail -n 1)
          echo "Runner summary: ${SUMMARY:-none} passed (expected $EXPECTED_TOTAL)"
          if [ "${SUMMARY:-none}" != "$EXPECTED_TOTAL" ]; then FAILED=1; fi
          if grep -E '^\[ +FAILED +\]|SKIPPED: ' "$LOG"; then FAILED=1; fi
          exit "$FAILED"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-report-${{ github.sha }}
          path: |
            source-js/build/reports/tests/iosSimulatorArm64Test
            source-js/build/test-results/iosSimulatorArm64Test
          if-no-files-found: ignore
