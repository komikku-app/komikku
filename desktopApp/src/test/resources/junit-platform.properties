# DesktopDataDirTeardown (META-INF/services): stops the app's delayed data folder writers after each test class.
# Autodetection would enable every service-registered extension on the test classpath; there is one more,
# io.mockk.junit5.MockKExtension (mockk-jvm's META-INF/services, checked 2026-11-25), so only the teardown is included.
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.extensions.autodetection.include=app.komikku.desktop.DesktopDataDirTeardown
